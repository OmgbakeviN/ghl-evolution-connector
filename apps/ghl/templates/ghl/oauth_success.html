<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Installation terminée</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-slate-100 p-6 text-slate-900">

    <main class="w-full max-w-xl rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-sm">

        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-500 text-white">
            <svg
                class="h-8 w-8"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
            >
                <path d="m5 12 4 4L19 6"></path>
            </svg>
        </div>

        <p class="mt-6 text-sm font-semibold uppercase tracking-wider text-emerald-600">
            Evolution Messaging
        </p>

        <h1 class="mt-2 text-3xl font-bold">
            Installation réussie
        </h1>

        <p class="mt-4 text-slate-600">
            L’application a été associée à votre sous-compte HighLevel.
        </p>

        <div class="mt-6 rounded-2xl border border-blue-200 bg-blue-50 p-4 text-sm text-blue-800">
            Retournez dans HighLevel puis ouvrez
            <strong>Evolution Messaging</strong> dans le menu de gauche
            pour connecter votre numéro WhatsApp.
        </div>

        <button
            type="button"
            onclick="window.close()"
            class="mt-6 rounded-xl bg-slate-950 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-800"
        >
            Fermer cette page
        </button>

    </main>

</body>
</html>
